<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SETARA | Statistik Edukasi Terbuka untuk Analisis Rekomendasi Akses. Melihat kesenjangan pendidikan Indonesia lewat data BPS."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SETARA | Melihat kesenjangan pendidikan lewat data BPS" />
    <meta
      property="og:description"
      content="Siapa yang tertinggal, seberapa jauh, dan apa yang perlu dilakukan. Analisis kesenjangan pendidikan Indonesia dari data BPS."
    />
    <meta property="og:url" content="https://setara-web.vercel.app/" />
    <meta property="og:image" content="https://setara-web.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SETARA: siapa yang tertinggal, seberapa jauh, dan apa yang perlu dilakukan." />
    <meta name="twitter:image" content="https://setara-web.vercel.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#F5F6F8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SETARA | Melihat kesenjangan pendidikan lewat data BPS</title>
    <link rel="preload" href="/fonts/public-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Data dipakai semua halaman: diunduh bersamaan dengan JavaScript, bukan setelahnya. -->
    <link rel="preload" href="/data/tidak_sekolah.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/data/provinsi.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/data/indikator.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/data/meta.json" as="fetch" crossorigin="anonymous" />
    <!-- Foto hero halaman pertama (Ringkasan, jenjang SMA bawaan) dimuat sebelum JavaScript berjalan. -->
    <!-- Foto hero Ringkasan (SMA) hanya dimuat awal di halaman Ringkasan, supaya halaman lain tidak ikut mengunduhnya. -->
    <script>
      (function () {
        var q = new URLSearchParams(location.search).get('jenjang')
        if (location.pathname !== '/' || (q && q !== 'SMA')) return
        var l = document.createElement('link')
        var j = '/images/jenjang/sma-'
        l.rel = 'preload'
        l.as = 'image'
        l.href = j + '800.jpg'
        l.setAttribute('fetchpriority', 'high')
        l.setAttribute('imagesrcset', j + '640.jpg 640w, ' + j + '800.jpg 800w, ' + j + '1200.jpg 1200w, ' + j + '1600.jpg 1600w')
        l.setAttribute('imagesizes', '(min-width: 1080px) 1048px, 100vw')
        document.head.appendChild(l)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
